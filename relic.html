<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Relics · Amīratu al-ʿUlūm</title>
<style>
/* The same house the rest of it is in: As-Sayf's warm near-black and its two
   golds. The room is dark on purpose - these are objects that make their own
   light, and you cannot judge that in a lit room. */
@font-face{font-family:'Sch';src:url('assets/ScheherazadeNew-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'EB Garamond';src:url('assets/fonts/EBGaramond.ttf') format('truetype');font-weight:400 700;font-display:swap}
:root{
  --bg:#0b0907; --ink:#e9dcc1; --muted:#b3a482; --faint:#9a8d6c;
  --gold:#c8a96e; --gold-bright:#ecdfae;
  --line:rgba(200,169,110,.22); --line-strong:rgba(200,169,110,.46);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:400 16px/1.6 'EB Garamond',Georgia,serif;-webkit-font-smoothing:antialiased}
canvas{display:block}
.ar{font-family:'Sch','Amiri','Traditional Arabic',serif}

#top{position:fixed;top:0;left:0;right:0;z-index:5;padding:16px 20px 22px;
  background:linear-gradient(180deg,rgba(11,9,7,.92),rgba(11,9,7,0));pointer-events:none}
#top .kick{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
#top h1{margin:6px 0 0;font-weight:500;font-size:26px;letter-spacing:-.01em}

#pick{position:fixed;left:0;right:0;bottom:0;z-index:5;
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  padding:14px 16px 20px;background:linear-gradient(0deg,rgba(11,9,7,.94),rgba(11,9,7,0))}
#pick button{font:500 13px/1 'EB Garamond',Georgia,serif;letter-spacing:.08em;
  padding:10px 16px;border-radius:3px;cursor:pointer;color:var(--muted);
  background:rgba(11,9,7,.6);border:1px solid var(--line);
  transition:color .2s,border-color .2s}
#pick button:hover{color:var(--gold-bright);border-color:var(--line-strong)}
#pick button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#pick button[aria-selected="true"]{color:#23170a;background:var(--gold);border-color:var(--gold)}

#name{position:fixed;left:20px;bottom:74px;z-index:5;pointer-events:none;max-width:min(420px,60vw)}
#name .ar{display:block;font-size:30px;line-height:1.3;color:var(--gold-bright)}
#name .en{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
#name p{margin:8px 0 0;font-size:14.5px;color:var(--muted)}

#hint{position:fixed;right:20px;bottom:78px;z-index:5;pointer-events:none;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
@media (max-width:640px){
  #name{left:16px;bottom:96px;max-width:calc(100vw - 32px)}
  #name .ar{font-size:24px}
  #hint{display:none}
  #top h1{font-size:21px}
}
</style>
</head>
<body>
<div id="top">
  <div class="kick">Amīratu al-ʿUlūm</div>
  <h1>The Relics of the Rawḍa</h1>
</div>
<div id="load">Loading…</div>
<div id="name"><span class="ar"></span><span class="en"></span><p></p></div>
<div id="hint">Drag to turn · scroll to come closer</div>
<nav id="pick"></nav>

<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/CopyShader.js"></script>
<script src="js/LuminosityHighPassShader.js"></script>
<script src="js/EffectComposer.js"></script>
<script src="js/RenderPass.js"></script>
<script src="js/ShaderPass.js"></script>
<script src="js/MaskPass.js"></script>
<script src="js/UnrealBloomPass.js"></script>
<script src="js/relicfx.js"></script>
<script src="js/relicview.js"></script>
</body>
</html>
