<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor · Amīratu al-ʿUlūm</title>
<style>
  :root {
    --bg: #14121b;
    --panel: rgba(20, 18, 27, 0.94);
    --line: #3a3346;
    --ink: #e6ddcd;
    --dim: #a1957f;
    --gold: #d9b25f;
    --hot: #e0a13c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20;
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  #bar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #bar .grow { flex: 1; }
  button, .btn {
    background: #241f30; color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 10px; cursor: pointer; font: inherit;
    white-space: nowrap;
  }
  button:hover { background: #2f2840; border-color: #55496a; }
  button.on { background: var(--hot); color: #1b1508; border-color: var(--hot); font-weight: 600; }
  button.ghost { background: transparent; }

  .panel {
    position: fixed; top: 40px; bottom: 0; z-index: 15;
    background: var(--panel); border-color: var(--line);
    display: flex; flex-direction: column; backdrop-filter: blur(6px);
  }
  #left { left: 0; width: 232px; border-right: 1px solid var(--line); }
  #right { right: 0; width: 236px; border-left: 1px solid var(--line); }
  .phead {
    padding: 8px 10px; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--dim); border-bottom: 1px solid var(--line);
  }
  .pbody { flex: 1; overflow-y: auto; padding: 6px; }
  .pbody::-webkit-scrollbar { width: 9px; }
  .pbody::-webkit-scrollbar-thumb { background: #332c42; border-radius: 5px; }

  #search {
    width: 100%; padding: 6px 8px; margin-bottom: 6px;
    background: #100e16; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; font: inherit;
  }
  .grp { margin-bottom: 4px; }
  .grp > .gh {
    padding: 5px 7px; cursor: pointer; border-radius: 4px;
    color: var(--gold); font-weight: 600; font-size: 12px;
  }
  .grp > .gh:hover { background: #241f30; }
  .grp .items { display: none; padding-left: 4px; }
  .grp.open .items { display: block; }
  .item {
    padding: 4px 8px; border-radius: 4px; cursor: pointer;
    color: var(--ink); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item:hover { background: #2b2439; }
  .item.sel { background: var(--hot); color: #1b1508; font-weight: 600; }

  .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
  .row label { width: 54px; color: var(--dim); font-size: 11px; }
  .row input {
    flex: 1; min-width: 0; padding: 4px 6px; background: #100e16; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; font: inherit;
  }
  .muted { color: var(--dim); font-size: 11px; }
  #objs { margin-top: 8px; }
  #objs .o {
    padding: 3px 7px; border-radius: 4px; cursor: pointer; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #objs .o:hover { background: #2b2439; }
  #objs .o.sel { background: #4a3a1c; color: #ffd98a; }

  #hint {
    position: fixed; left: 240px; bottom: 8px; z-index: 12;
    color: var(--dim); font-size: 11.5px; pointer-events: none;
    text-shadow: 0 1px 3px #000;
  }
  #stat {
    position: fixed; right: 244px; bottom: 8px; z-index: 12;
    color: var(--dim); font-size: 11.5px; pointer-events: none;
    text-shadow: 0 1px 3px #000; text-align: right;
  }
  #toast {
    position: fixed; left: 50%; top: 54px; transform: translateX(-50%);
    background: var(--hot); color: #1b1508; padding: 6px 14px; border-radius: 5px;
    z-index: 40; font-weight: 600; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  #toast.on { opacity: 1; }
  #load {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); z-index: 60; color: var(--dim); letter-spacing: .1em;
  }
  #diag {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    color: #ff9a8a; font-size: 12px; z-index: 30; max-width: 60vw; text-align: center;
  }
  #hb { position: fixed; right: 6px; top: 44px; color: #6b6076; font-size: 10px; z-index: 12; }
</style>
</head>
<body>

<div id="load">preparing the editor…</div>

<div id="bar">
  <button id="mSelect" class="on">Select</button>
  <button id="mPlace">Place</button>
  <button id="mScatter">Scatter</button>
  <button id="mLand">Land</button>
  <div class="sep"></div>
  <button id="snapGrid" class="ghost">Grid off</button>
  <button id="snapGround" class="on">Sit on ground</button>
  <div class="sep"></div>
  <button id="undo" class="ghost">Undo</button>
  <button id="redo" class="ghost">Redo</button>
  <div class="sep"></div>
  <button id="save" class="ghost">Save</button>
  <button id="load2" class="ghost">Load</button>
  <button id="exp" class="ghost">Export</button>
  <button id="imp" class="ghost">Import</button>
  <div class="grow"></div>
  <button id="day" class="on">Daylight</button>
  <button id="town" class="ghost">Add the town</button>
  <button id="clear" class="ghost">Clear</button>
  <button id="play">Walk it ▸</button>
</div>

<div id="left" class="panel">
  <div class="phead">Assets</div>
  <div class="pbody">
    <input id="search" placeholder="search…" autocomplete="off">
    <div id="tree"></div>
  </div>
</div>

<div id="right" class="panel">
  <div class="phead">Selected</div>
  <div class="pbody">
    <div id="selname" class="muted">nothing selected</div>
    <div class="row"><label>X</label><input id="px" type="number" step="0.1"></div>
    <div class="row"><label>Y</label><input id="py" type="number" step="0.1"></div>
    <div class="row"><label>Z</label><input id="pz" type="number" step="0.1"></div>
    <div class="row"><label>Turn</label><input id="ry" type="number" step="1"></div>
    <div class="row"><label>Size</label><input id="sc" type="number" step="0.05"></div>
    <div class="row">
      <button id="dup" style="flex:1">Duplicate</button>
      <button id="row" style="flex:1">+ Row</button>
      <button id="del" style="flex:1">Delete</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button id="grp" style="flex:1">Group</button>
      <button id="ungrp" style="flex:1">Ungroup</button>
    </div>
    <div class="phead" style="margin:10px -6px 0;border-top:1px solid var(--line)">Scatter</div>
    <div class="row"><label>Radius</label><input id="bR" type="number" step="1" value="16"></div>
    <div class="row"><label>How many</label><input id="bN" type="number" step="1" value="14"></div>
    <div class="row"><label>Spacing</label><input id="bGap" type="number" step="0.2" value="2.6"></div>
    <div class="row"><label>Size from</label><input id="bSmin" type="number" step="0.05" value="0.85"></div>
    <div class="row"><label>Size to</label><input id="bSmax" type="number" step="0.05" value="1.35"></div>
    <div class="row"><label>Edge</label><input id="bEdge" type="number" step="0.05" value="0.55"></div>
    <div class="row" style="gap:8px">
      <label style="flex:none"><input id="bRot" type="checkbox" checked> turn each</label>
      <label style="flex:none"><input id="bMix" type="checkbox" checked> mix chosen</label>
    </div>
    <div id="bmix" class="muted" style="font-size:11px;margin:2px 0 6px"></div>
    <div class="row">
      <button id="bAdd" style="flex:1">Add to mix</button>
      <button id="bClr" style="flex:1">Clear mix</button>
    </div>
    <div class="phead" style="margin:10px -6px 0;border-top:1px solid var(--line)">In the scene</div>
    <div id="objs"></div>
  </div>
</div>

<div id="hint"></div>
<div id="stat"></div>
<div id="toast"></div>
<div id="diag"></div>
<div id="hb"></div>
<input id="file" type="file" accept="application/json" style="display:none">

<script>document.write('<script src="js/bootedit.js?t=' + Date.now() + '"><\/script>')</script>
<div id="landPanel" style="display:none;position:fixed;right:12px;top:64px;background:#1c1a17e6;border:1px solid #3a352e;border-radius:8px;padding:10px;width:230px;color:#d8cfc0;font:13px/1.5 system-ui;z-index:30">
  <div style="font-weight:600;margin-bottom:6px">The Land</div>
  <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
    <button class="lb on" id="lbRaise">Raise</button>
    <button class="lb" id="lbLower">Lower</button>
    <button class="lb" id="lbSmooth">Smooth</button>
    <button class="lb" id="lbFlat">Flatten</button>
    <button class="lb" id="lbWater">Water</button>
    <button class="lb" id="lbDry">Dry</button>
  </div>
  <label style="display:block">Brush <span id="lbRadV">18</span> m
    <input id="lbRad" type="range" min="4" max="70" value="18" style="width:100%"></label>
  <label style="display:block">Strength <span id="lbStrV">6</span>
    <input id="lbStr" type="range" min="1" max="20" value="6" style="width:100%"></label>
  <div style="margin-top:6px;opacity:.75">Paint on the ground. Mountains, valleys, rivers - the game grows them where you brush.</div>
  <button id="lbReset" style="width:100%;margin-top:8px">Flatten everything back</button>
</div>
</body>
</html>
